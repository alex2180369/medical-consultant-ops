<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Consultant Monitor</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #0f172a; color: #e2e8f0; }
    h1 { margin-top: 0; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .ok { color: #4ade80; } .bad { color: #f87171; } .warn { color: #fbbf24; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .item { background: #334155; border-radius: 8px; padding: 12px; }
    button, input { padding: 8px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: inherit; }
    button { cursor: pointer; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🩺 Medical Consultant Monitor</h1>
  <div class="card">
    <label>URL статуса: <input id="statusUrl" size="50" value="https://помощники-консультанты.рф/ops/status" /></label>
    <button id="refresh">Обновить</button>
    <span id="updated"></span>
  </div>
  <div class="card">
    <div id="summary" class="warn">Загрузка...</div>
    <div id="checks" class="grid"></div>
  </div>
  <div class="card">
    <h3>Сырой ответ</h3>
    <pre id="raw"></pre>
  </div>
  <script>
    const statusEl = document.getElementById('summary');
    const checksEl = document.getElementById('checks');
    const rawEl = document.getElementById('raw');
    const updatedEl = document.getElementById('updated');

    async function refresh() {
      const url = document.getElementById('statusUrl').value;
      statusEl.textContent = 'Загрузка...';
      try {
        const response = await fetch(url);
        const data = await response.json();
        rawEl.textContent = JSON.stringify(data, null, 2);
        const cls = data.status === 'ok' ? 'ok' : (data.status === 'degraded' ? 'warn' : 'bad');
        statusEl.innerHTML = `Статус: <span class="${cls}">${data.status}</span> · Ошибки: ${data.failed?.length ? data.failed.join(', ') : 'нет'}`;
        checksEl.innerHTML = Object.entries(data.checks || {}).map(([name, item]) => `
          <div class="item">
            <strong class="${item.ok ? 'ok' : 'bad'}">${name}</strong>
            <div>${item.message}</div>
          </div>
        `).join('');
        updatedEl.textContent = `Обновлено: ${new Date().toLocaleString()}`;
      } catch (error) {
        statusEl.innerHTML = `<span class="bad">Ошибка: ${error}</span>`;
      }
    }

    document.getElementById('refresh').addEventListener('click', refresh);
    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
